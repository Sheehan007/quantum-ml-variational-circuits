[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qml-vqc-experiments"
version = "0.1.0"
description = "Reproducible quantum machine learning experiments with variational circuits and classical baselines"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Sheehan Mathur" }]
keywords = ["quantum-machine-learning", "qiskit", "pennylane", "pytorch", "variational-quantum-circuit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pennylane>=0.43,<0.46",
  "qiskit>=2.1,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
qml-vqc = "qml_vqc.experiments:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qml_vqc"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
